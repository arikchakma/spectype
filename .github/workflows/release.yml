name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, pgo: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: true, pgo: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true, pgo: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe, pgo: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - if: matrix.zig
        run: |
          curl -sSfL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - if: matrix.zig
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild
      - name: Build
        shell: bash
        # Pin glibc 2.17 so the gnu binaries run on old distros, not just the runner's glibc.
        run: |
          build() {
            if [ -n "${{ matrix.zig }}" ]; then
              suffix=""
              case "${{ matrix.target }}" in *-gnu) suffix=".2.17" ;; esac
              cargo zigbuild --release -p spectype --target "${{ matrix.target }}$suffix"
            else
              cargo build --release -p spectype --target ${{ matrix.target }}
            fi
          }
          if [ -n "${{ matrix.pgo }}" ]; then
            rustup component add llvm-tools
            # zig can't link the profiler runtime, so the profile comes from a plain build for the runner's own target.
            RUSTFLAGS="-Cprofile-generate=$GITHUB_WORKSPACE/target/pgo-raw" cargo build --release -p spectype --target-dir target/pgo
            for f in fixtures/ots/examples/*.yaml fixtures/ots/examples/*.json fixtures/ots/examples/digital-ocean-api/DigitalOcean-public.v2.yaml; do
              "target/pgo/release/spectype${{ matrix.exe }}" "$f" > /dev/null
            done
            sysroot="$(rustc --print sysroot | tr '\\' /)"
            host="$(rustc -vV | sed -n 's/^host: //p')"
            "$sysroot/lib/rustlib/$host/bin/llvm-profdata" merge -o target/pgo.profdata target/pgo-raw
            echo "PGO_RUSTFLAGS=-Cprofile-use=$GITHUB_WORKSPACE/target/pgo.profdata" >> "$GITHUB_ENV"
            export RUSTFLAGS="-Cprofile-use=$GITHUB_WORKSPACE/target/pgo.profdata"
          fi
          build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - name: Build the native addon
        shell: bash
        env:
          # A musl addon is loaded by Node, so it links musl's libc dynamically.
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }} ${{ env.PGO_RUSTFLAGS }}
        run: |
          npm ci --prefix npm
          case "${{ matrix.target }}" in
            *-linux-gnu)
              cargo zigbuild --release -p spectype_napi --target "${{ matrix.target }}.2.17"
              arch=x64
              case "${{ matrix.target }}" in aarch64-*) arch=arm64 ;; esac
              cp "target/${{ matrix.target }}/release/libspectype_napi.so" "npm/spectype/spectype.linux-$arch-gnu.node"
              ;;
            *-linux-musl) npm run build --prefix npm -- --target "${{ matrix.target }}" -x ;;
            *) npm run build --prefix npm -- --target "${{ matrix.target }}" ;;
          esac
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/spectype${{ matrix.exe }}" "dist/spectype-${{ matrix.target }}${{ matrix.exe }}"
          cp npm/spectype/spectype.*.node dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build the WebAssembly fallback
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1
          npm ci --prefix npm
          npm run build:wasm --prefix npm
          cp npm/platforms/wasm32-wasip1/spectype.wasm32-wasip1.wasm dist/
      - name: Stage npm packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          node npm/scripts/stage.mjs "$version" dist
          node npm/scripts/check.mjs
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          FLAGS: ${{ github.ref_type == 'tag' && '--provenance' || '--dry-run' }}
        run: |
          for dir in npm/platforms/*/; do
            npm publish "$dir" "$FLAGS" --access public
          done
          npm publish ./npm/spectype "$FLAGS" --access public
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/spectype-*
          generate_release_notes: true
